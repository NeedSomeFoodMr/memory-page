# Add this service to the compose file that runs Hindsight, with this folder saved beside it as ./memory-page.
# The page then reaches Hindsight by its service name on the compose network.
services:
  memory-page:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # This machine only. Reach it over a private network, or put a sign-in in front of it.
      - "127.0.0.1:9998:9998"
    environment:
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY}
      HINDSIGHT_BANK: default
      HINDSIGHT_UPSTREAM: hindsight:8888
      # The names you open the page by, without the port. Any other name is refused.
      PAGE_HOSTS: "localhost 127.0.0.1"
    volumes:
      - ./memory-page/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./memory-page/site:/srv:ro

  # Optional: the Review section. Without this service the page is read-only.
  # To switch it on, also set REVIEW_UPSTREAM: memory-review:8080 on memory-page above.
  memory-review:
    image: python:3.13-alpine
    restart: unless-stopped
    command: python /app/review.py
    # Runs as you, so it can write its one file into ./memory-page/review-data. Create that folder
    # first, owned by this same user id (check yours with `id -u`), or the service cannot save.
    user: "1000:1000"
    environment:
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY}
      HINDSIGHT_BANK: default
      HINDSIGHT_UPSTREAM: hindsight:8888
    volumes:
      - ./memory-page/review/review.py:/app/review.py:ro
      - ./memory-page/review-data:/data
